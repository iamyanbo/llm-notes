<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="The unit square and its image under M with columns (1, one half) and (0, 1)">
<rect width="720" height="340" fill="#faf9f6"/>
<style>text{font-family:Georgia,serif;fill:#171717}.caption{font-size:20px}.label{font-size:16px}.grid{stroke:#555657;stroke-width:1;opacity:.35;fill:none}.axis{stroke:#171717;stroke-width:1.6;fill:none}.first{stroke:#174da5;stroke-width:3;fill:none}.second{stroke:#8e4822;stroke-width:3;fill:none}</style>
<defs><marker id="basis-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#174da5"/></marker><marker id="basis-rust" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8e4822"/></marker></defs>
